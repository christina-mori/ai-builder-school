<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>给一条有用的反馈 · AI Builder School</title><style>body{max-width:820px;margin:40px auto;padding:0 24px;color:#403c36;background:#fffcf5;font:17px/1.9 system-ui,sans-serif}h1{font-size:30px}h2,h3{margin-top:32px}pre,.prompt{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0eadc;padding:20px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #d5cdbd;padding:8px;text-align:left}.lesson-table{overflow:auto}a{color:#526e85}header,footer{color:#736b61;font-size:14px}footer{margin-top:40px;border-top:1px solid #d5cdbd;padding-top:16px}</style></head><body><header>AI BUILDER SCHOOL · 示例锦囊 · 入门 / 测试与交付</header><main><h1>给一条有用的反馈</h1><p>告诉伙伴哪里好用、哪里还可以更清楚。</p><h2>可以这样开始</h2><ol><li>实际打开对方的作品，先体验一次。</li><li>说一个你喜欢的具体地方。</li><li>指出一处说明不清楚或操作不方便的地方。</li><li>给一条可以行动的建议，让作者自己决定怎么改。</li></ol><h2>提示模板</h2><pre>我试用了你的作品，最喜欢的是【具体地方】，因为【原因】。
我在【具体操作】时遇到了【情况】。
如果下一版可以【一个建议】，我会更容易理解或使用。</pre></main><footer>这是课程平台的示例材料，正式内容以教练发布为准。HTML 文件可下载后用浏览器打开。</footer></body></html>
