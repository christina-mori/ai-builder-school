<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>做一张个性头像 · AI Builder School</title><style>body{max-width:820px;margin:40px auto;padding:0 24px;color:#403c36;background:#fffcf5;font:17px/1.9 system-ui,sans-serif}h1{font-size:30px}h2,h3{margin-top:32px}pre,.prompt{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0eadc;padding:20px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #d5cdbd;padding:8px;text-align:left}.lesson-table{overflow:auto}a{color:#526e85}header,footer{color:#736b61;font-size:14px}footer{margin-top:40px;border-top:1px solid #d5cdbd;padding-top:16px}</style></head><body><header>AI BUILDER SCHOOL · 示例锦囊 · 入门 / 视觉与多媒体</header><main><h1>做一张个性头像</h1><p>用一个有记忆点的画面表达自己。</p><h2>可以这样开始</h2><ol><li>从自我介绍里选出两三个特点。</li><li>把特点变成有代表性的物件、动作或场景。</li><li>在豆包或即梦尝试生图，选择能表达自己的版本。</li></ol><h2>提示模板</h2><pre>请根据这些特点，为我设计一张个性鲜明的漫画头像：【填写特点】。用具体的物件、动作和场景体现，人物主体清楚，方形构图，不出现姓名和文字。只使用我提供的信息，不编造经历。</pre></main><footer>这是课程平台的示例材料，正式内容以教练发布为准。HTML 文件可下载后用浏览器打开。</footer></body></html>
